name: Notify on Label Added to PR

on:
  pull_request:
    types: [labeled]

jobs:
  notify:
    runs-on: ubuntu-latest
    steps:
      - name: Check Out Repository
        uses: actions/checkout@v3   

      - name: Check PR Label
        if: github.event.label.name == 'Ready for code review'
        run: |
          echo "PR #${{ github.event.pull_request.number }} is ready for code review"
          echo "Label: ${{ github.event.label.name }}"
          echo "PR Title: ${{ github.event.pull_request.title }}"
          echo "PR URL: ${{ github.event.pull_request.html_url }}"

      - name: Send Email Notification via SMTP
        if: github.event.label.name == 'Ready for code review'
        uses: dawidd6/action-send-mail@v3
        with:
          server_address: smtp.sendgrid.net
          server_port: 587
          username: apikey
          password: ${{ secrets.SENDGRID_API_KEY }}
          subject: "PR Ready for Code Review"
          to: prince@empowerlearning.net
          from: prince@empowerlearning.net
          body: |
            A pull request has been labeled as "Ready for Code Review".

            PR Number: #${{ github.event.pull_request.number }}
            Title: ${{ github.event.pull_request.title }}
            URL: ${{ github.event.pull_request.html_url }}
